services:
  postgres_dev:
    image: pgvector/pgvector:pg17
    container_name: aipcpp_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aipcpp_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres_test:
    image: pgvector/pgvector:pg17
    container_name: aipcpp_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aipcpp_db_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aipcpp_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aipcpp_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  #  worker:
  #    build:
  #      context: .
  #      dockerfile: Dockerfile
  #    container_name: aipcpp_worker
  #    command: uv run celery -A app.config.celery worker --loglevel=info
  #    environment:
  #      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres_dev:5432/aipcpp_db
  #      - REDIS_URL=redis://redis:6379/0
  #      - S3_ENDPOINT_URL=http://minio:9000
  #      - S3_ACCESS_KEY=minioadmin
  #      - S3_SECRET_KEY=minioadmin
  #    depends_on:
  #      postgres_dev:
  #        condition: service_healthy
  #      redis:
  #        condition: service_healthy
  #      minio:
  #        condition: service_healthy
  #    restart: unless-stopped
  #
  flower:
    image: mher/flower:2.0
    container_name: aipcpp_flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_dev_data:
  minio_data:
