version: '3.8'

services:
  postgres_dev:
    image: postgres:17-alpine
    container_name: aipcpp_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres_test:
    image: postgres:17-alpine
    container_name: aipcpp_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_test
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aipcpp_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_dev_data:
