[project]
name = "aipcpp-mahi-onboarding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "boto3>=1.43.1",
    "celery>=5.6.3",
    "fastapi>=0.136.1",
    "litellm>=1.83.14",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "redis>=7.4.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.46.0",
    "greenlet>=3.1.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
target-version = ['py312']
line-length = 88
include = '\.pyi?$'

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C90"]
ignore = ["E501"]  # Line length is handled by Black
